name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  testes:
    name: testes (${{ matrix.so }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.so }}
    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: as regras, a busca e o juiz
        shell: bash
        run: node --test testes/nucleo.test.js
      - name: os numeros do README
        shell: bash
        run: node --test testes/medidas.test.js
      - name: 3x7, 4x5, a cruzada e o juiz no 4x4
        shell: bash
        run: node --max-old-space-size=4096 --test testes/pesados.test.js

  medidas:
    name: tabelas do README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: todos os inicios, tabuleiros leves
        run: node ferramentas/medidor.js inicios
      - name: 3x7 e 4x5
        run: node --max-old-space-size=4096 ferramentas/medidor.js pesados
      - name: o tamanho do primeiro lance
        run: node ferramentas/medidor.js abertura
      - name: a tabela cruzada
        run: node ferramentas/medidor.js cruzada
      - name: o juiz ate o 3x4
        run: node ferramentas/medidor.js juiz
      # Mais de 11 milhoes de posicoes, perto do teto de 2^24 do Map: roda uma
      # vez so, aqui, e nao nos nove jobs da matriz.
      - name: o 5x5 das quinas opostas
        run: node --max-old-space-size=6144 --test testes/quinas5.test.js
